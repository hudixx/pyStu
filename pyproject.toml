# 对标 pom.xml：项目元数据和依赖声明。
# 安装（先激活 .venv）：
#   python -m pip install -e ".[web,test,lint,llm]"
# -e 表示 editable，改代码不用重装。

[project]
name = "pystu"
version = "0.1.0"
description = "Java 开发者学 Python"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
web = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pydantic>=2.0",
]
test = [
    "pytest>=8.0",
    # 选修 B3 的异步测试。第 20 课的同步测试不用它。
    "pytest-asyncio>=0.24",
]
lint = [
    "ruff>=0.8",
    "mypy>=1.13",
]
llm = [
    "openai>=1.50",
]
# 只给第 49 课读评测表。不是数据分析依赖。
table = [
    "pandas>=2.2",
]
# 第 50 课起用 SQLite，不要求单独装数据库。
db = [
    "sqlalchemy>=2.0",
]

# ruff ≈ Checkstyle。本课只开 E/F，不对整个练习仓库开严规则。
[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F"]

# mypy ≈ 可选的 javac。ignore_missing_imports：第三方包没 stub 时不要刷屏。
[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
